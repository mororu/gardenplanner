<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<!--
			viewport-fit=cover ist Pflicht, nicht Kosmetik: ohne diesen Wert liefert
			env(safe-area-inset-bottom) auf iOS immer 0, und die fest am unteren Rand
			liegende Navigationsleiste rutscht im installierten Modus unter den
			Home-Indikator.
		-->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<meta
			name="description"
			content="Aufgabenliste für den Gemeinschaftsgarten: sehen, was offen ist, und mit einem Griff abhaken."
		/>

		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />

		<!--
			Eine einzige, unqualifizierte Zeile: seit dem Wegfall des dunklen Modus
			gibt es kein zweites Schema mehr, dem ein Paar folgen müsste. Der Wert
			ist --accent und muss es bleiben — Gate-Regel 5 hält Token, Meta und
			Manifest zusammen.
		-->
		<meta name="theme-color" content="#3F6B4A" />

		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Gemeinschaftsgarten" />

		<style>
			/*
			 * Der Gestaltungsrahmen. Jeder Farb-, Grössen-, Radius- und Abstandswert der
			 * Anwendung steht hier und nur hier; Komponenten lesen die Werte
			 * ausschliesslich über CSS Custom Properties und immer ohne Fallback.
			 * Werte gerechnet aus DESIGN.md, Grössen in rem bei 16px Wurzel, damit
			 * die systemweite Vergrösserung greift.
			 * Das Tor prüft beide Richtungen: kein Farb- oder Massliteral in einer
			 * Komponente und kein benutztes Token ohne Deklaration hier. Die dritte
			 * Richtung — jedes Farb-Token braucht einen Wert im Dunkel-Block — ist
			 * am 2026-09-13 mit dem dunklen Modus weggefallen (Gate-Regel 4).
			 */
			:root {
				/* Es gibt nur noch einen gestalteten Modus, und der Browser soll
				   auch nur diesen annehmen: Formularelemente und Scrollbalken folgen
				   sonst dem System und stünden hell gestalteten Seiten dunkel
				   gegenüber. */
				color-scheme: light;

				/*
				   Farben. **Ein Token, ein Wert** — seit dem Wegfall des dunklen Modus
				   gibt es kein zweites Schema mehr, in dem eine Farbe ein Gegenstück
				   bräuchte. Die Palette heisst Leinen & Salbei: warmer Leinengrund,
				   eine Karte, die nicht reinweiss ist, und ein entsättigtes Salbeigrün
				   als einziger Akzent.

				   Alle Werte sind gerechnet und nicht geschätzt; die Tabelle in
				   DESIGN.md führt sie, und `npm run kontrast:selftest` hält jene
				   Tabelle gegen die Rechnung.
				*/
				--surface-base: #f6f2ea;
				--surface-raised: #fffdf8;
				--ink-primary: #241f18;
				--ink-secondary: #6b6153;
				--hairline: #e5dccc;
				--accent: #3f6b4a;
				/*
				   Die Schrift auf gefüllter Akzentfläche. Sie trägt denselben Wert wie
				   --surface-raised, und das ist kein Versehen: die Karte ist das
				   hellste Weiss dieser Palette, und genau dieses Weiss gehört auf das
				   Grün. Zwei Token mit einem Wert bleiben zwei Token — das eine ist
				   eine Fläche, das andere eine Schriftfarbe, und sie trennen sich,
				   sobald eines von beiden sich bewegt.
				   Gemessen: 6.05:1 auf --accent.
				*/
				--accent-ink: #fffdf8;
				/*
				   Die Fläche einer Einzelaufgabe, die bisher niemand übernommen hat.

				   Eine getönte Karte und kein Abzeichen: der Zustand gilt für die ganze
				   Zeile und nicht für eine Ecke davon. Der Ton ist derselbe Grünstich wie
				   der Akzent, aber ohne dessen Sättigung — DESIGN.md verbietet gesättigte
				   Varianten des Akzents, und eine grün gefüllte Karte schriee.

				   **Wie hell, ist nicht Geschmack, sondern gerechnet.** Die Grenze ist
				   --ink-secondary: der Nebentext liegt auf der Karte bei 5.97:1, und
				   jede dunklere Tönung drückt ihn Richtung der 4.5 aus NFR9. Gemessen
				   mit der Kontrastrechnung des Projekts: dieser Wert hält 5.26.

				   Die Fläche hebt sich darum nur um 1.14:1 von der Karte ab. Den
				   Unterschied trägt der Farbton und nicht die Helligkeit — und die Aussage
				   trägt ohnehin der Satz, der danebensteht. Farbe als einziger Träger
				   eines Zustands ist in DESIGN.md ausdrücklich verboten.

				   **Kein Wortlaut der Oberfläche in diesem Kommentar.** Diese Datei geht
				   mitsamt ihren Kommentaren an jeden Besucher jeder Seite; eine hier
				   zitierte Wendung steht damit auch dort, wo sie nicht hingehört, und
				   lässt Wachen anschlagen, die ihr Fehlen belegen. Gemessen am
				   2026-09-13, nicht vermutet.

				   Gemessen: Fliesstext 14.16:1, Nebentext 5.26:1, Akzent 5.33:1.
				*/
				--surface-open: #edf0e4;
				/*
				   Der Kopf eines aufklappbaren Abschnitts.

				   **Warum es dieses Token gibt.** Bis zum 2026-09-13 trug der Griff
				   dieselbe Fläche und dieselbe Kante wie jede andere Karte der Seite —
				   er sah damit aus wie ein Eintrag der Liste, die er überschreibt, und
				   wo ein Abschnitt aufhörte, sagte allein der Abstand. Seither ist der
				   Abschnitt ein Behälter: der Kopf sitzt auf dieser Fläche, der Inhalt
				   darunter auf --surface-raised, beide in einem Rahmen.

				   Ein Leinenton und kein Grau: er ist die dunklere Schwester von
				   --surface-base und hält damit denselben warmen Stich wie der Grund.
				   Gegen die Karte sind es 1.21:1 — mehr als die 1.14:1, die
				   --surface-open gegen dieselbe Karte hat, und das ist Absicht: hier
				   trennt die Fläche zwei Schichten, dort färbt sie einen Zustand.

				   Gemessen: Fliesstext 13.28:1, Nebentext 4.93:1, Akzent 5.00:1.
				*/
				--surface-griff: #ede7db;
				--overdue: #98481d;
				/*
				   Gold, und nur für die unbesetzte Dienstwoche (Epic 3): eine Lücke,
				   die jemand schliessen muss — kein Fehler und keine Gefahr, darum
				   nicht --danger, und kein Liegenbleiben, darum nicht --overdue.

				   **Dieses Token trug bis zum 2026-09-13 zwei Aufgaben, und daran ist
				   es fast zerbrochen.** Es färbte zugleich die Kante einer Erntestufe.
				   Eine Textfarbe muss 4.5:1 halten, eine 3px-Kante nur 3:1 — und weil
				   immer die strengere Anforderung gewann, blieb die Kante blass. Die
				   Ampel hat seither eigene Token (--reif-*), und dieses hier hat wieder
				   genau einen Zweck.

				   **Von --overdue unterscheidet es der Farbton, nicht die Helligkeit:**
				   die zwei liegen bei 1.18:1 zueinander, aber das eine ist Rostlehm und
				   das andere Gold. Bis zum 2026-09-13 waren es 1.07:1 bei gleichem Ton,
				   und der Tokenblock nannte das ausdrücklich hingenommen. Getragen wird
				   die Aussage ohnehin vom Wort — die zwei Zustände stehen seit dem
				   2026-09-11 beide auf der Startseite, in verschiedenen Blöcken und mit
				   verschiedenen Wörtern.

				   Gemessen: 5.35:1 auf --surface-raised, 4.87:1 auf --surface-base.
				*/
				--warn: #856500;
				/*
				   Rot, und nur für Zerstörendes: der Knopf `Einladung widerrufen`.
				   Es gibt bewusst kein --danger-ink, weil der zerstörende Knopf
				   durchsichtig bleibt — Text und Umriss tragen diesen Wert, es
				   entsteht nie eine gefüllte rote Fläche, die eine eigene
				   Schriftfarbe bräuchte.

				   **Seit dem 2026-09-13 ist das wieder wahr.** Bis dahin lieh sich eine
				   Erntestufe dieses Token für ihre Kante, obwohl DESIGN.md Rot
				   ausdrücklich für Zerstörendes reserviert. Eine reife Zucchini ist
				   keine Gefahr; die Stufe hat jetzt --reif-sofort.

				   Gemessen: 6.71:1 auf --surface-raised, 6.11:1 auf
				   --surface-base. Damit liegt der Wert im Kontrastband des
				   Akzents (6.05:1) und schreit nicht heraus.
				 */
				--danger: #a33427;
				/*
				   Die Ampel der Ernte. Drei Token für drei Stufen, und der Grund für
				   ihre Existenz ist eine Rechnung und keine Vorliebe:

				   Diese drei Farben erscheinen **ausschliesslich** als Kante in der
				   Breite von --border-marker — auf /ernte an der Karte, auf / an der
				   Zeile. Eine Kante, die zu einem Bedienelement gehört, hält nach NFR9
				   3:1; Text hielte 4.5:1. Solange die Stufen sich Textfarben liehen
				   (--danger, --warn, --accent), waren sie an die strengere Schwelle
				   gebunden und entsprechend gedämpft — die mittlere Stufe war auf drei
				   Pixeln praktisch nicht zu sehen. Mit eigenen Token darf sie Bernstein
				   sein statt Gold.

				   **Das Wort trägt die Aussage weiterhin allein.** Neben jeder Kante
				   steht die Stufe ausgeschrieben — auf /ernte in der Überschrift des
				   Abschnitts, auf / in der Marke an der Zeile. Farbe als einziger
				   Träger eines Zustands bleibt verboten, und diese drei Token ändern
				   daran nichts; sie machen die Kante nur sichtbar für die, die sie
				   sehen können.

				   Gemessen gegen **beide** angrenzenden Flächen, weil die Kante
				   zwischen Karte und Grund liegt:
				     sofort  5.35:1 auf --surface-raised, 4.87:1 auf --surface-base
				     stehen  3.55:1 auf --surface-raised, 3.23:1 auf --surface-base
				     wachsen 4.99:1 auf --surface-raised, 4.54:1 auf --surface-base
				*/
				--reif-sofort: #c0392b;
				--reif-stehen: #b87a00;
				--reif-wachsen: #2f7d46;

				/* Schriftfamilien — selbst gehostet, geladen aus dem eigenen Stilblatt */
				--font-heading: 'Figtree Variable', 'Figtree', system-ui, sans-serif;
				--font-text: 'Inter Variable', 'Inter', system-ui, sans-serif;

				/* Typografie-Rolle display — 30px, Seitentitel, einer pro Seite */
				--display-font: var(--font-heading);
				--display-size: 1.875rem;
				--display-weight: 700;
				--display-line: 1.12;
				--display-tracking: -0.02em;

				/* Typografie-Rolle section — 20px, Titelleiste und Abschnittstitel */
				--section-font: var(--font-heading);
				--section-size: 1.25rem;
				--section-weight: 700;
				--section-line: 1.2;
				--section-tracking: -0.015em;

				/* Typografie-Rolle task — 16px, Aufgabentext und Textfelder */
				--task-font: var(--font-text);
				--task-size: 1rem;
				--task-weight: 400;
				--task-line: 1.45;

				/* Typografie-Rolle body — 16px, Fliesstext */
				--body-font: var(--font-text);
				--body-size: 1rem;
				--body-weight: 400;
				--body-line: 1.55;

				/* Typografie-Rolle meta — 13px, Termine und Navigationsbeschriftung */
				--meta-font: var(--font-text);
				--meta-size: 0.8125rem;
				--meta-weight: 500;
				--meta-line: 1.4;

				/* Typografie-Rolle label — 12px, Abschnittsmarken in Grossbuchstaben */
				--label-font: var(--font-text);
				--label-size: 0.75rem;
				--label-weight: 600;
				--label-line: 1.3;
				--label-tracking: 0.09em;

				/* Typografie-Rolle action — 16px, Knopftext */
				--action-font: var(--font-heading);
				--action-size: 1rem;
				--action-weight: 700;
				--action-line: 1;

				/* Radien — 5px, 8px, 12px */
				--radius-sm: 0.3125rem;
				--radius-md: 0.5rem;
				--radius-lg: 0.75rem;

				/* Abstände — 4px-Skala, nichts dazwischen, nichts darüber */
				--space-1: 0.25rem;
				--space-2: 0.5rem;
				--space-3: 0.75rem;
				--space-4: 1rem;
				--space-5: 1.5rem;
				--space-6: 2rem;

				/* Masse */
				--gutter: 1rem;
				--measure: 37.5rem;
				--touch: 2.75rem;
				/* Die **sichtbare** Grösse des Kästchens der Aufgabenzeile, 22px.
				   Sichtbare Grösse und Trefferfeld sind zwei verschiedene Dinge
				   (DESIGN.md, task-box): nur das Trefferfeld muss --touch erreichen,
				   und es entsteht über Innenabstand. Der Abstand zwischen beiden ist
				   gerechnet und steht nirgends als Zahl:
				   calc((var(--touch) - var(--task-box)) / -2) zieht das Trefferfeld
				   über die Zeile hinaus, ohne die Zeilenhöhe aufzublähen. */
				--task-box: 1.375rem;
				/* Die **sichtbare** Grösse eines Zeichens neben einem Wort, 18px. Wie beim
				   Kästchen der Aufgabenzeile ist das nicht das Trefferfeld: das entsteht am
				   Knopf darum herum und hält --touch. 18px und nicht 22px, weil das Zeichen
				   neben Text in der meta-Rolle (13px) steht und nicht allein in einer Zeile.
				   Das Zeichen nimmt currentColor. */
				--zeichen: 1.125rem;
				/* Mindesthöhe des Textfelds der Massen-Eingabe auf /monatsplan
				   (DESIGN.md, components.textarea-bulk.minHeight): 16em, damit man
				   beim Schreiben einer Monatsliste nicht in einem Schlitz tippt.
				   In em und nicht in rem, weil die Höhe an der Schriftgrösse des
				   Feldes hängen soll und nicht an der der Wurzel — wächst der Text,
				   wächst das Feld mit. Der Wert steht hier und nicht als 16em in
				   der Komponente: Gate-Regel 1 liest nur px und rem, ein rohes em
				   liefe an ihr vorbei, und die nächste Grösse brächte ihre eigene
				   Zahl mit. */
				--textarea-bulk-min-height: 16em;
				/* Eigene Höhe der Navigationsleiste, nicht --touch: die Leiste ist ein
				   Layoutmass, das der Inhalt unten freihalten muss. 48px, damit jedes
				   Ziel über dem 44px-Boden liegt. */
				--navbar-height: 3rem;

				/* Kantenbreiten — 1px Haarlinie, 2px Zustandskante, 3px Diensthinweis */
				--border-hairline: 0.0625rem;
				--border-active: 0.125rem;
				--border-marker: 0.1875rem;

				/*
				   Zeiten — genau eine, weil es genau eine Animation gibt.

				   Der Übergang der Aufgabenzeile in den durchgestrichenen Zustand
				   (DESIGN.md: 140ms; EXPERIENCE.md: „unter 150 ms" — kein
				   Widerspruch, die konkrete Zahl gilt). Sie steht hier und nicht als
				   140ms in der Komponente, weil sonst die nächste Animation ihre
				   eigene Zahl mitbrächte; Gate-Regel 1 weist ein rohes ms/s in einer
				   Bewegungs-Eigenschaft ab, damit diese Deklaration nicht umgehbar
				   ist.
				 */
				--duration-quick: 140ms;
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			html {
				-webkit-text-size-adjust: 100%;
			}

			body {
				margin: 0;
				background-color: var(--surface-base);
				color: var(--ink-primary);
				font-family: var(--body-font);
				font-size: var(--body-size);
				font-weight: var(--body-weight);
				line-height: var(--body-line);
			}

			:focus-visible {
				outline: var(--border-active) solid var(--accent);
				outline-offset: var(--border-active);
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
