<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<!--
			viewport-fit=cover ist Pflicht, nicht Kosmetik: ohne diesen Wert liefert
			env(safe-area-inset-bottom) auf iOS immer 0, und die fest am unteren Rand
			liegende Navigationsleiste rutscht im installierten Modus unter den
			Home-Indikator.
		-->
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<!--
			**Hier steht kein title-Element.** Es stand hier und war der Grund, dass
			jeder Seitentitel aus svelte:head wirkungslos blieb: bei mehreren
			title-Elementen nimmt der Browser das erste, und dieses stand vor der
			Einfügemarke für den Kopfbereich. Zwei title-Elemente sind zudem kein
			gültiges HTML. Jede Seite trägt ihren eigenen Titel —
			src/routes/+page.svelte, mehr/+page.svelte, verwaltung/+page.svelte und
			+error.svelte. Eine neue Seite braucht darum einen, sonst zeigt der
			Reiter ihre Adresse. Die rahmenlose src/error.html hat ihren eigenen.

			In diesem Kommentar darf die Einfügemarke nicht wörtlich stehen: SvelteKit
			ersetzt sie auch innerhalb eines Kommentars, der eingesetzte Kopfbereich
			enthält selbst Kommentarmarken, und deren Ende schliesst diesen Kommentar
			vorzeitig — der Rest des Textes stünde dann sichtbar über der Titelleiste.
			Genau das ist am 2026-08-27 passiert. Gate-Regel 12 hält es fest.
		-->
		<meta
			name="description"
			content="Aufgabenliste für den Gemeinschaftsgarten: sehen, was offen ist, und mit einem Griff abhaken."
		/>

		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />

		<!-- Unqualifiziert für Browser ohne media-Unterstützung, danach das Paar je Schema.
		     scripts/gate.mjs vergleicht diese drei Werte mit --accent aus dem Token-Block. -->
		<meta name="theme-color" content="#2F6B3F" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#2F6B3F" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#7FBB8C" />

		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Gemeinschaftsgarten" />

		<style>
			/*
			 * Der Gestaltungsrahmen. Jeder Farb-, Grössen-, Radius- und Abstandswert der
			 * Anwendung steht hier und nur hier; Komponenten lesen die Werte
			 * ausschliesslich über CSS Custom Properties und immer ohne Fallback.
			 * Werte gerechnet aus DESIGN.md, Grössen in rem bei 16px Wurzel, damit
			 * die systemweite Vergrösserung greift.
			 * scripts/gate.mjs prüft beide Richtungen: kein Farb- oder Massliteral in
			 * einer Komponente, kein benutztes Token ohne Deklaration hier, und kein
			 * Farb-Token ohne Wert im Dunkel-Block.
			 */
			:root {
				/* Beide Modi sind gestaltet, also darf der Browser beide annehmen —
				   Formularelemente und Scrollbalken folgen damit dem Schema. */
				color-scheme: light dark;

				/* Farben — hell */
				--surface-base: #f5f4ef;
				--surface-raised: #ffffff;
				--ink-primary: #1c221b;
				--ink-secondary: #66705f;
				--hairline: #dcdcd2;
				--accent: #2f6b3f;
				--accent-ink: #ffffff;
				--overdue: #9a5a12;
				/*
				   Rot, und nur für Zerstörendes: der Knopf `Einladung widerrufen`.
				   Es gibt bewusst kein --danger-ink, weil der zerstörende Knopf
				   durchsichtig bleibt — Text und Umriss tragen diesen Wert, es
				   entsteht nie eine gefüllte rote Fläche, die eine eigene
				   Schriftfarbe bräuchte.
				   Gemessen: 7.07:1 auf --surface-raised, 6.42:1 auf
				   --surface-base. Damit liegt der Wert im Kontrastband des
				   Akzents (6.37:1) und schreit nicht heraus.
				 */
				--danger: #a32e22;

				/* Schriftfamilien — selbst gehostet, siehe src/lib/styles/fonts.css */
				--font-heading: 'Figtree Variable', 'Figtree', system-ui, sans-serif;
				--font-text: 'Inter Variable', 'Inter', system-ui, sans-serif;

				/* Typografie-Rolle display — 30px, Seitentitel, einer pro Seite */
				--display-font: var(--font-heading);
				--display-size: 1.875rem;
				--display-weight: 700;
				--display-line: 1.12;
				--display-tracking: -0.02em;

				/* Typografie-Rolle section — 20px, Titelleiste und Abschnittstitel */
				--section-font: var(--font-heading);
				--section-size: 1.25rem;
				--section-weight: 700;
				--section-line: 1.2;
				--section-tracking: -0.015em;

				/* Typografie-Rolle task — 16px, Aufgabentext und Textfelder */
				--task-font: var(--font-text);
				--task-size: 1rem;
				--task-weight: 400;
				--task-line: 1.45;

				/* Typografie-Rolle body — 16px, Fliesstext */
				--body-font: var(--font-text);
				--body-size: 1rem;
				--body-weight: 400;
				--body-line: 1.55;

				/* Typografie-Rolle meta — 13px, Termine und Navigationsbeschriftung */
				--meta-font: var(--font-text);
				--meta-size: 0.8125rem;
				--meta-weight: 500;
				--meta-line: 1.4;

				/* Typografie-Rolle label — 12px, Abschnittsmarken in Grossbuchstaben */
				--label-font: var(--font-text);
				--label-size: 0.75rem;
				--label-weight: 600;
				--label-line: 1.3;
				--label-tracking: 0.09em;

				/* Typografie-Rolle action — 16px, Knopftext */
				--action-font: var(--font-heading);
				--action-size: 1rem;
				--action-weight: 700;
				--action-line: 1;

				/* Radien — 5px, 8px, 12px */
				--radius-sm: 0.3125rem;
				--radius-md: 0.5rem;
				--radius-lg: 0.75rem;

				/* Abstände — 4px-Skala, nichts dazwischen, nichts darüber */
				--space-1: 0.25rem;
				--space-2: 0.5rem;
				--space-3: 0.75rem;
				--space-4: 1rem;
				--space-5: 1.5rem;
				--space-6: 2rem;

				/* Masse */
				--gutter: 1rem;
				--measure: 37.5rem;
				--touch: 2.75rem;
				/* Die **sichtbare** Grösse des Kästchens der Aufgabenzeile, 22px.
				   Sichtbare Grösse und Trefferfeld sind zwei verschiedene Dinge
				   (DESIGN.md, task-box): nur das Trefferfeld muss --touch erreichen,
				   und es entsteht über Innenabstand. Der Abstand zwischen beiden ist
				   gerechnet und steht nirgends als Zahl:
				   calc((var(--touch) - var(--task-box)) / -2) zieht das Trefferfeld
				   über die Zeile hinaus, ohne die Zeilenhöhe aufzublähen. */
				--task-box: 1.375rem;
				/* Mindesthöhe des Textfelds der Massen-Eingabe auf /monatsplan
				   (DESIGN.md, components.textarea-bulk.minHeight): 16em, damit man
				   beim Schreiben einer Monatsliste nicht in einem Schlitz tippt.
				   In em und nicht in rem, weil die Höhe an der Schriftgrösse des
				   Feldes hängen soll und nicht an der der Wurzel — wächst der Text,
				   wächst das Feld mit. Der Wert steht hier und nicht als 16em in
				   der Komponente: Gate-Regel 1 liest nur px und rem, ein rohes em
				   liefe an ihr vorbei, und die nächste Grösse brächte ihre eigene
				   Zahl mit. Kein Farbwert, also ohne Dunkel-Pendant. */
				--textarea-bulk-min-height: 16em;
				/* Eigene Höhe der Navigationsleiste, nicht --touch: die Leiste ist ein
				   Layoutmass, das der Inhalt unten freihalten muss. 48px, damit jedes
				   Ziel über dem 44px-Boden liegt. */
				--navbar-height: 3rem;

				/* Kantenbreiten — 1px Haarlinie, 2px Zustandskante, 3px Diensthinweis */
				--border-hairline: 0.0625rem;
				--border-active: 0.125rem;
				--border-marker: 0.1875rem;

				/*
				   Zeiten — genau eine, weil es genau eine Animation gibt.

				   Der Übergang der Aufgabenzeile in den durchgestrichenen Zustand
				   (DESIGN.md: 140ms; EXPERIENCE.md: „unter 150 ms" — kein
				   Widerspruch, die konkrete Zahl gilt). Sie steht hier und nicht als
				   140ms in der Komponente, weil sonst die nächste Animation ihre
				   eigene Zahl mitbrächte; Gate-Regel 1 weist ein rohes ms/s in einer
				   Bewegungs-Eigenschaft ab, damit diese Deklaration nicht umgehbar
				   ist. Kein Farbwert, also ohne Dunkel-Pendant — Regel 4 verlangt
				   eines nur für Farben.
				 */
				--duration-quick: 140ms;
			}

			/* Der dunkle Modus ist gleichrangig gestaltet: eigene Werte, keine Invertierung,
			   kein Filter. Nur die neun Farben wechseln, alle Masse bleiben gleich. */
			@media (prefers-color-scheme: dark) {
				:root {
					--surface-base: #12160f;
					--surface-raised: #1a2018;
					--ink-primary: #e9ede4;
					--ink-secondary: #98a292;
					--hairline: #2c3529;
					--accent: #7fbb8c;
					--accent-ink: #0e1410;
					--overdue: #d99b4e;
					/* Gemessen: 6.48:1 auf --surface-raised, 7.13:1 auf --surface-base */
					--danger: #e8877b;
				}
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			html {
				-webkit-text-size-adjust: 100%;
			}

			body {
				margin: 0;
				background-color: var(--surface-base);
				color: var(--ink-primary);
				font-family: var(--body-font);
				font-size: var(--body-size);
				font-weight: var(--body-weight);
				line-height: var(--body-line);
			}

			:focus-visible {
				outline: var(--border-active) solid var(--accent);
				outline-offset: var(--border-active);
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
