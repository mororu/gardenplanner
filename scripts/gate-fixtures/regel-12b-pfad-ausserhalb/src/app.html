<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#2f6b3f" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#2f6b3f" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#7fbb8c" />
		<style>
			:root {
				--surface-base: #f5f4ef;
				--surface-raised: #ffffff;
				--accent: #2f6b3f;
				--gutter: 1rem;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--surface-base: #12160f;
					--surface-raised: #1a2018;
					--accent: #7fbb8c;
				}
			}
			body {
				background-color: var(--surface-base);
				border-color: var(--surface-raised);
			}
		</style>
		<!-- viewport-fit=cover ist Pflicht: ohne den Wert liefert die Sicherheitszone 0. -->
		<meta name="generator" content="src/app.html" />
		<!-- Der Kopfbereich wird von SvelteKit eingesetzt, direkt hinter diesem Kommentar. -->
		%sveltekit.head%
	</head>
	<body>
		<!-- sveltekit.body ohne Prozentzeichen ist Prosa und keine Marke. -->
		<p>scripts/gate.mjs steht hier als sichtbarer Text und nicht in einem Kommentar.</p>
		%sveltekit.body%
	</body>
</html>
