<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#2f6b3f" />
		<style>
			:root {
				--surface-base: #f5f4ef;
				--surface-raised: #ffffff;
				--accent: #2f6b3f;

			}

				border-color: var(--surface-raised);

			Hier steht kein title-Element. Es stand vor %sveltekit.head% und machte
			damit jeden Seitentitel wirkungslos.
		-->
		%sveltekit.head%
	</head>
	<body>
		%sveltekit.body%
	</body>
</html>
