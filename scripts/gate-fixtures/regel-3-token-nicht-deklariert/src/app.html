<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#2f6b3f" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#2f6b3f" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#7fbb8c" />
		<style>
			:root {
				--surface-base: #f5f4ef;
				--surface-raised: #ffffff;
				--accent: #2f6b3f;
				--gutter: 1rem;
				/* Fehlerprobe zu Regel 3, erster Fall: hier steht
				   --nur-im-kommentar: 1rem; nur in einem Kommentar. Eine Erwähnung
				   ist keine Deklaration — die erste Fassung des Tors hat jedes
				   --x: im ganzen Dateitext als Deklaration gezählt. */
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--surface-base: #12160f;
					--surface-raised: #1a2018;
					--accent: #7fbb8c;
				}
			}
			body {
				background-color: var(--surface-base);
				border-color: var(--surface-raised);
				/* Fehlerprobe zu Regel 3, zweiter Fall: eine Deklaration in einem
				   anderen Selektor als :root gilt nicht als Token. */
				--nur-in-einem-anderen-selektor: 1rem;
			}
		</style>
		%sveltekit.head%
	</head>
	<body>
		%sveltekit.body%
	</body>
</html>
