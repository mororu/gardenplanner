<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#2f6b3f" />
		<style>
			:root {
				--surface-base: #f5f4ef;
				--surface-raised: #ffffff;
				--accent: #2f6b3f;
				--gutter: 1rem;
				/* Fehlerprobe zu Regel 8: dieses Token benutzt keine Komponente.
				   Das ist ausdrücklich kein Fehler — Tokens dürfen für spätere
				   Stories reserviert sein. Das Tor sagt es nur. */
				--noch-von-keiner-komponente-benutzt: 0.25rem;
			}
			body {
				background-color: var(--surface-base);
				border-color: var(--surface-raised);
			}
		</style>
		%sveltekit.head%
	</head>
	<body>
		%sveltekit.body%
	</body>
</html>
