# Rahmenkonfiguration. Die Server-Blöcke stehen in conf.d/app.conf, gerendert
# aus templates/app.conf.template — siehe den Kopf jener Datei.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
	worker_connections  1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;

	# Version und Signatur nicht ausplaudern.
	server_tokens off;

	log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
	                  '$status $body_bytes_sent "$http_referer" '
	                  '"$http_user_agent"';

	access_log  /var/log/nginx/access.log  main;

	sendfile        on;
	tcp_nopush      on;
	keepalive_timeout  65;

	# Es gibt keine Uploads. ARCHITECTURE-SPINE.md:247.
	client_max_body_size 1M;

	# Die Zone muss im http-Block stehen; im server-Block ist limit_req_zone
	# ungültig und nginx startet nicht. Benutzt wird sie in genau einem
	# location-Block: /i/.
	#
	# 20r/m mit burst=10 nodelay ist bewusst grosszügig. Ein Token hat 32
	# zufällige Bytes — Erraten ist keine realistische Gefahr, und die
	# Begrenzung ist Tiefenstaffelung, nicht die Verteidigungslinie. Was sie
	# wirklich verhindert, ist eine Protokoll- und Ressourcenflut. Zu eng
	# gesetzt trifft sie die Falschen: zwanzig Leute in einem Garten hängen oft
	# an derselben Mobilfunk-NAT-Adresse, und ein Messenger holt die
	# Verbindungsvorschau selbst ab, bevor der Mensch tippt. Ein 429 auf den
	# einzigen Weg herein wäre der teuerste Fehler dieser Anwendung.
	#
	# 1 MB Zonengrösse fasst rund 16000 Adressen.
	limit_req_zone $binary_remote_addr zone=einloesen:1m rate=20r/m;

	# Für die Upgrade-Kopfzeilen im Proxy-Block. Die Anwendung hält keine
	# WebSocket-Verbindung (kein Polling, kein SSE, kein WebSocket), aber ein
	# durchgereichtes Upgrade kostet nichts und fehlt sonst genau dann, wenn es
	# je gebraucht wird.
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
	}

	# Kein `gzip on`. adapter-node liefert build/client mit precompress selbst
	# aus (svelte.config.js), also liegen .br und .gz schon vor. Ein zweiter
	# Ausliefernder oder Komprimierer wäre eine zweite Wahrheit.

	include /etc/nginx/conf.d/*.conf;
}
